<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>BlackBerry Bus Times</title>
<style>
body{margin:6px;font-family:Arial,sans-serif;font-size:14px;background:#fff;color:#000}
body.dark{background:#111;color:#fff}
h1{text-align:center;font-size:20px;margin:5px 0 8px}
input{width:92%;padding:7px;font-size:14px;border:1px solid #000}
button{padding:7px 9px;margin:3px 2px;font-size:14px;border:1px solid #000;background:#eee;color:#000}
.dark button{background:#333;color:#fff;border-color:#aaa}
.dark input{background:#222;color:#fff;border-color:#aaa}
.panel{border:1px solid #000;padding:6px;margin-bottom:7px}.dark .panel{border-color:#aaa}
.stop{border:1px solid #000;padding:9px;margin:5px 0}.dark .stop{border-color:#aaa}
.stop a,.fav a{font-weight:bold;font-size:15px}
.bus{border-bottom:1px solid #aaa;padding:7px 2px}.route{font-size:18px;font-weight:bold}.time{float:right;font-weight:bold}
.small{font-size:11px}.fav{padding:8px;border-bottom:1px solid #aaa}#error{color:#b00000;font-weight:bold}
</style>
</head>
<body>
<h1>BB BUS TIMES</h1>
<div class="panel">
<input id="search" type="text" placeholder="Bus stop or postcode">
<br>
<button type="button" onclick="searchStops()">SEARCH</button>
<button type="button" onclick="showFavourites()">FAVOURITES</button>
<button type="button" onclick="toggleDark()">DARK</button>
</div>
<div id="status" class="small"></div>
<div id="error"></div>
<div id="favourites"></div>
<div id="stops"></div>
<div id="results"></div>
<script type="text/javascript">
var selectedStop="";
var selectedName="";
var timer=null;
var autoRefresh=true;
var favourites=[];

function byId(id){return document.getElementById(id)}

function loadSettings(){
try{
var f=localStorage.getItem("bb_favourites");
if(f){favourites=JSON.parse(f)}
if(localStorage.getItem("bb_dark")==="1"){document.body.className="dark"}
}catch(e){}
}

function saveSettings(){
try{localStorage.setItem("bb_favourites",JSON.stringify(favourites))}catch(e){}
}

function request(url,callback){
var x=new XMLHttpRequest();
x.onreadystatechange=function(){
if(x.readyState!==4){return}
if(x.status===200){
try{callback(null,JSON.parse(x.responseText))}catch(e){callback("bad response",null)}
}else{callback("HTTP "+x.status,null)}
};
try{x.open("GET",url,true);x.send()}catch(e){callback("connection error",null)}
}

function searchStops(){
stopAutoRefresh();
var q=byId("search").value.replace(/^\s+|\s+$/g,"");
if(!q){byId("error").innerHTML="Type a bus stop name.";return}
clearPage();
byId("status").innerHTML="Searching TfL...";
var url="https://api.tfl.gov.uk/StopPoint/Search?query="+encodeURIComponent(q)+"&modes=bus";
request(url,function(err,data){
if(!err&&data&&data.matches&&data.matches.length){showStops(data.matches);return}
byId("status").innerHTML="No exact search result. Trying wider search...";
wideSearch(q);
});
}

function wideSearch(q){
var wanted=normalise(q);
var url="https://api.tfl.gov.uk/StopPoint?modes=bus";
request(url,function(err,data){
if(err||!data){byId("error").innerHTML="TfL search failed.";return}
var out=[],i,n,s,words,j,ok;
for(i=0;i<data.length;i++){
s=data[i]; if(!s.name||!s.id){continue}
n=normalise(s.name);
if(n.indexOf(wanted)>=0){out.push(s)}
}
if(!out.length){
words=wanted.split(" ");
for(i=0;i<data.length;i++){
s=data[i]; if(!s.name||!s.id){continue}
n=normalise(s.name);ok=true;
for(j=0;j<words.length;j++){if(words[j].length>1&&n.indexOf(words[j])<0){ok=false;break}}
if(ok){out.push(s)}
}
}
showStops(out.slice(0,15));
});
}

function showStops(list){
var h="<b>Choose your stop:</b>";
if(!list||!list.length){h+="<br>No matching stops found.";byId("status").innerHTML="";byId("stops").innerHTML=h;return}
var i,s;
for(i=0;i<Math.min(list.length,15);i++){
s=list[i];
h+='<div class="stop"><a href="#" onclick="loadStop(\''+js(s.id)+'\',\''+js(s.name)+'\');return false;">'+html(s.name)+'</a><br><span class="small">'+html(s.id)+'</span></div>';
}
byId("status").innerHTML="";byId("stops").innerHTML=h;
}

function loadStop(id,name){
stopAutoRefresh();selectedStop=id;selectedName=name;
byId("stops").innerHTML="";byId("favourites").innerHTML="";loadArrivals();startAutoRefresh();
}

function loadArrivals(){
if(!selectedStop){return}
byId("status").innerHTML="Updating live times...";
var url="https://api.tfl.gov.uk/StopPoint/"+encodeURIComponent(selectedStop)+"/Arrivals";
request(url,function(err,data){
if(err||!data){byId("error").innerHTML="Could not contact TfL.";return}
if(data.length){showArrivals(data);return}
loadChildren(selectedStop);
});
}

function loadChildren(id){
var url="https://api.tfl.gov.uk/StopPoint/"+encodeURIComponent(id)+"?includeChildren=true";
request(url,function(err,detail){
if(err||!detail||!detail.children||!detail.children.length){showArrivals([]);return}
var children=detail.children, combined=[],left=children.length,i;
for(i=0;i<children.length;i++){
(function(child){
if(!child.id){left--;if(!left){showArrivals(combined)}return}
var u="https://api.tfl.gov.uk/StopPoint/"+encodeURIComponent(child.id)+"/Arrivals";
request(u,function(e,d){
if(!e&&d){combined=combined.concat(d)}
left--;if(!left){showArrivals(combined)}
});
})(children[i]);
}
});
}

function showArrivals(data){
data.sort(function(a,b){return a.timeToStation-b.timeToStation});
var h='<div class="panel"><b>'+html(selectedName)+'</b><br><br>'+favButton()+'<button type="button" onclick="toggleAutoRefresh()">'+(autoRefresh?"AUTO: ON":"AUTO: OFF")+'</button><button type="button" onclick="toggleDark()">DARK</button></div>';
var i,b,m;
for(i=0;i<Math.min(data.length,15);i++){
b=data[i];m=Math.round(b.timeToStation/60);if(m<0){m=0}
h+='<div class="bus"><span class="route">'+html(b.lineName)+'</span><span class="time">'+m+' min</span><br>'+html(b.destinationName)+'</div>';
}
if(!data.length){h+="No live buses found right now."}
h+='<br><button type="button" onclick="loadArrivals()">REFRESH NOW</button>';
byId("error").innerHTML="";byId("status").innerHTML="Updated "+new Date().toLocaleTimeString();byId("results").innerHTML=h;
}

function favButton(){return isFav(selectedStop)?'<button type="button" onclick="removeFavourite()">REMOVE FAVOURITE</button>':'<button type="button" onclick="addFavourite()">SAVE FAVOURITE</button>'}
function isFav(id){var i;for(i=0;i<favourites.length;i++){if(favourites[i].id===id){return true}}return false}
function addFavourite(){if(selectedStop&&!isFav(selectedStop)){favourites.push({id:selectedStop,name:selectedName});saveSettings();loadArrivals()}}
function removeFavourite(){var i;for(i=0;i<favourites.length;i++){if(favourites[i].id===selectedStop){favourites.splice(i,1);break}}saveSettings();loadArrivals()}

function showFavourites(){
stopAutoRefresh();clearPage();var h='<div class="panel"><b>MY FAVOURITES</b></div>',i;
if(!favourites.length){h+="No saved stops yet."}
for(i=0;i<favourites.length;i++){h+='<div class="fav"><a href="#" onclick="loadStop(\''+js(favourites[i].id)+'\',\''+js(favourites[i].name)+'\');return false;">'+html(favourites[i].name)+'</a></div>'}
byId("favourites").innerHTML=h;
}

function startAutoRefresh(){if(autoRefresh){stopAutoRefresh();timer=setInterval(loadArrivals,30000)}}
function stopAutoRefresh(){if(timer){clearInterval(timer);timer=null}}
function toggleAutoRefresh(){autoRefresh=!autoRefresh;if(autoRefresh){startAutoRefresh()}else{stopAutoRefresh()}loadArrivals()}
function toggleDark(){if(document.body.className==="dark"){document.body.className="";localStorage.setItem("bb_dark","0")}else{document.body.className="dark";localStorage.setItem("bb_dark","1")}}
function normalise(t){return String(t).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").replace(/^\s+|\s+$/g,"")}
function js(t){return String(t).replace(/\/g,"\\").replace(/'/g,"\'")}
function html(t){return String(t).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""")}
function clearPage(){byId("error").innerHTML="";byId("status").innerHTML="";byId("stops").innerHTML="";byId("results").innerHTML="";byId("favourites").innerHTML=""}

byId("search").onkeypress=function(e){e=e||window.event;if((e.keyCode||e.which)===13){searchStops();return false}};
loadSettings(); </script>

</body>
</html>
